<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title> Gerenciador de Usuários</title>
</head>

<body>
    <div id="container">
        <h1><u>Cadastrar Novos Usuários</u></h1>
        <div class="cadastro">

            <form>
                <input type="text" id="usuário" name="usuário" placeholder="Nome Completo">
                <input type="text" id="cargo" name="cargo" placeholder="Cargo ou função">

                <button id="botao" type="submit">Salvar no Sistema</button>
            </form>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
