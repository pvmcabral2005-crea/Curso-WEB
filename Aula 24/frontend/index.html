<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title> Gerenciador de Usuários</title>
</head>

<body>
    <div id="container">
        <h1><u>Cadastrar Novos Usuários</u></h1>
        <div class="cadastro">

            <form id="formulario-inscricao">
                <input type="text" id="nome" name="nome" placeholder="Nome Completo">
                <input type="text" id="cargo" name="cargo" placeholder="Cargo ou função">

                <button id="botao" type="submit">Salvar no Sistema</button>
            </form>
        </div>
         <div id="cadastros">
             <h2> Usuários Cadastrados</h2>
            <ul id="listaVisual">
                <button id="btn-editar" onclick="Editarlista">Editar</button>
                <button id="btn-deletar" onclick="Deletarlista"></button>
            </ul>
             
        </div>
    </div>
    <script src="script.js"></script>
</body>


</html>
